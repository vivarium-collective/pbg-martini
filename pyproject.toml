[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbg-martini"
version = "0.1.0"
description = "Process-bigraph wrapper for Martini coarse-grained force field via vermouth/martinize2"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=0.0.10",
    "bigraph-schema",
    "pbg-superpowers",
    "vermouth>=0.9.0",
    "numpy",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["pbg_martini*"]

[tool.setuptools.package-data]
pbg_martini = ["composites/*.composite.yaml"]

[project.optional-dependencies]
dev = [
    "pytest",
    "bigraph-viz",
    "plotly",
    "matplotlib",
]

[tool.uv.sources]
pbg-superpowers = { git = "https://github.com/vivarium-collective/pbg-superpowers.git", branch = "main" }

[tool.pytest.ini_options]
markers = [
    "integration: uses the real ecoli pack on disk (skipped if absent)",
    "network: requires network access (structure resolution)",
    "slow: slow tests (martinize2 a real protein)",
]
